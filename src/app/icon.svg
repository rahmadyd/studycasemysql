<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <!-- Cylinder Metallic Gradients -->
    <linearGradient id="dbTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <linearGradient id="dbBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="35%" stop-color="#2DD4BF" />
      <stop offset="70%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F766E" flood-opacity="0.5"/>
    </filter>
    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" />

  <!-- Database Stack Group -->
  <g filter="url(#glow)" transform="translate(0, -10)">
    <!-- Layer 3 (Bottom Disk) -->
    <path d="M 126 290 C 126 250, 386 250, 386 290 L 386 350 C 386 390, 126 390, 126 350 Z" fill="url(#dbBodyGrad)" />
    <ellipse cx="256" cy="290" rx="130" ry="40" fill="url(#dbTopGrad)" opacity="0.4" />
    <ellipse cx="256" cy="350" rx="130" ry="40" fill="none" stroke="#5EEAD4" stroke-width="4" opacity="0.6" />

    <!-- Layer 2 (Middle Disk) -->
    <path d="M 126 210 C 126 170, 386 170, 386 210 L 386 270 C 386 310, 126 310, 126 270 Z" fill="url(#dbBodyGrad)" />
    <ellipse cx="256" cy="210" rx="130" ry="40" fill="url(#dbTopGrad)" opacity="0.4" />
    <ellipse cx="256" cy="270" rx="130" ry="40" fill="none" stroke="#5EEAD4" stroke-width="4" opacity="0.6" />

    <!-- Layer 1 (Top Disk) -->
    <path d="M 126 130 C 126 90, 386 90, 386 130 L 386 190 C 386 230, 126 230, 126 190 Z" fill="url(#dbBodyGrad)" />
    <ellipse cx="256" cy="130" rx="130" ry="40" fill="url(#dbTopGrad)" />
    <ellipse cx="256" cy="190" rx="130" ry="40" fill="none" stroke="#5EEAD4" stroke-width="4" opacity="0.6" />
  </g>

  <!-- Accent Spark / Code Prompt Symbol '>_' Overlay -->
  <g filter="url(#accentGlow)" transform="translate(240, 260)">
    <!-- Shield / Badge Backing for Contrast -->
    <circle cx="90" cy="90" r="82" fill="#042F2E" stroke="url(#goldGrad)" stroke-width="8" />

    <!-- Terminal Code Caret '>' -->
    <path d="M 58 60 L 98 90 L 58 120" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Terminal Underscore Cursor '_' -->
    <line x1="108" y1="120" x2="132" y2="120" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
